# Local demo overrides: HTTP-only nginx on :8888, no certbot.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  minio:
    image: pgsty/minio:latest

  nginx:
    ports: !override
      - "8888:80"
    volumes: !override
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx

  certbot:
    profiles: ["prod"]
