services:
  postgres:
    image: postgres:16-alpine
    container_name: atix-postgres
    environment:
      POSTGRES_DB: ${PG_DB_NAME:-atix_backend}
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-postgres} -d ${PG_DB_NAME:-atix_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atix-network

  backend:
    build:
      context: ./AtixBackEnd
      dockerfile: Dockerfile
    container_name: atix-backend
    environment:
      PG_DB_NAME: ${PG_DB_NAME:-atix_backend}
      PG_USERNAME: ${PG_USERNAME:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_HOST: postgres
      PG_PORT: 5432
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_SENDER: ${MAILGUN_SENDER}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - atix-network

  frontend:
    build:
      context: ./AtixFrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: atix-frontend
    networks:
      - atix-network

  nginx:
    image: nginx:alpine
    container_name: atix-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - atix-network

volumes:
  postgres_data:

networks:
  atix-network:
    driver: bridge
